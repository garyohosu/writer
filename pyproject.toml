[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "writer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
writer-run-daily = "writer.scripts.run_daily:main"
writer-publish-story = "writer.scripts.publish_story:main"
